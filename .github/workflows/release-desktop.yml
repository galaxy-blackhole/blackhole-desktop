# author Bùi Trọng Hiếu
# email kevinbui210191@gmail.com
# create date 23/11/2026
# modify date 23/11/2026
# desc Phát hành app desktop Galaxy Blackhole — MỘT link duy nhất cho cả 3 nền.
#      Repo CÔNG KHAI chuyên trách phát hành: repo private thì GitHub không cấp runner macOS và tệp
#      cài phải đăng nhập mới tải; galaxy-code giữ private. Vỏ Tauri nằm trong repo blackhole-harness
#      (apps/desktop cho macOS, apps/desktop-windows cho Windows + Linux), host harness đóng vào app
#      lấy từ npm theo đúng version đã publish, và mọi tệp cài được đăng lên MỘT release của repo này.
#      Version app = version CLI mới nhất trên npm (hoặc input version).

name: release-desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version của app desktop (mặc định = version của CLI trong package.json)"
        required: false
        default: ""
      harness_version:
        description: "Version harness đóng vào app (mặc định: bản mới nhất trên npm)"
        required: false
        default: "latest"
      harness_ref:
        description: "Nhánh/tag của galaxy-blackhole/blackhole-harness chứa mã vỏ Tauri"
        required: false
        default: "main"
      publish_release:
        description: "Tạo/cập nhật release desktop-v<version> (false = chỉ build, để tải artifact)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  # Runtime Node nhúng trong app: harness chỉ boot bằng Node (native addon cần symbol V8), không bun.
  NODE_RUNTIME_VERSION: "26.9.0"
  HARNESS_REPO: galaxy-blackhole/blackhole-harness

jobs:
  resolve:
    name: Chốt version + tarball harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.tarball.outputs.url }}
      harness_version: ${{ steps.tarball.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Chốt version app
        id: version
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(npm view @galaxy-stack/blackhole-cli version); fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Tag push desktop-vX dùng chính X, để tên tệp và tên release không lệch nhau.
          echo "app version: $version"
          publish="${{ inputs.publish_release }}"
          if [ -z "$publish" ]; then publish=true; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Chốt tarball harness
        id: tarball
        run: |
          want="${{ inputs.harness_version }}"
          if [ -z "$want" ]; then want=latest; fi
          url=$(npm view "@galaxy-blackhole/blackhole-harness@$want" dist.tarball)
          version=$(npm view "@galaxy-blackhole/blackhole-harness@$want" version)
          if [ -z "$url" ]; then echo "không tìm được tarball harness@$want" >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "harness: $version ($url)"

  windows:
    name: Windows x64
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ inputs.harness_ref || 'main' }}
          path: shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shell/apps/desktop-windows/src-tauri
      - name: Đóng host harness từ npm
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.harness_version }}"
          $tarball = "${{ needs.resolve.outputs.tarball }}"
          Write-Host "harness $version"
          $stage = Join-Path $env:RUNNER_TEMP "stage"
          npm install --prefix $stage $tarball --omit=dev --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "npm install harness failed" }
          $pkg = Join-Path $stage "node_modules\@galaxy-blackhole\blackhole-harness"
          if (!(Test-Path (Join-Path $pkg "apps\cli\lib\main.js"))) { throw "host lib/main.js missing" }
          $res = Join-Path (Get-Location) "shell\apps\desktop-windows\src-tauri\resources"
          Remove-Item -Recurse -Force $res -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $res "host"), (Join-Path $res "runtime") | Out-Null
          Copy-Item -Path (Join-Path $pkg "*") -Destination (Join-Path $res "host") -Recurse -Force
          Copy-Item -Path (Join-Path $stage "node_modules") -Destination (Join-Path $res "host\node_modules") -Recurse -Force
          $fe = Join-Path $stage "node_modules\@deepseek-ai\dsh-web-frontend"
          if (Test-Path (Join-Path $fe "dist\index.html")) {
            $nested = Join-Path $res "host\packages\host\web-app\node_modules\@deepseek-ai"
            New-Item -ItemType Directory -Force $nested | Out-Null
            Copy-Item -Path $fe -Destination $nested -Recurse -Force
          } else { throw "frontend dist missing in stage" }
          # NSIS/makensis dùng đường dẫn ANSI/MAX_PATH: devtools mô tả dài và mọi tệp >220 ký tự làm build fail.
          $devtools = Join-Path $res "host\node_modules\@deepseek-ai\dsh-experimental-inspector\lib\devtools"
          if (Test-Path $devtools) { Remove-Item -Recurse -Force $devtools }
          $long = Get-ChildItem (Join-Path $res "host") -Recurse -File | Where-Object { $_.FullName.Length -gt 220 }
          if (@($long).Count -gt 0) { Write-Host "pruning $(@($long).Count) long paths"; $long | Remove-Item -Force }
          echo "STAGE=$stage" >> $env:GITHUB_ENV
      - name: Tải runtime Node ${{ env.NODE_RUNTIME_VERSION }} win-x64
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "node-win.zip"
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v${{ env.NODE_RUNTIME_VERSION }}/node-v${{ env.NODE_RUNTIME_VERSION }}-win-x64.zip" -OutFile $zip
          $out = Join-Path $env:RUNNER_TEMP "node-win"
          Expand-Archive -Path $zip -DestinationPath $out -Force
          $exe = Join-Path $out "node-v${{ env.NODE_RUNTIME_VERSION }}-win-x64\node.exe"
          if (!(Test-Path $exe)) { throw "node.exe missing" }
          Copy-Item $exe "shell\apps\desktop-windows\src-tauri\resources\runtime\node.exe" -Force
          & "shell\apps\desktop-windows\src-tauri\resources\runtime\node.exe" --version
      - name: Build vỏ Tauri Windows (NSIS)
        working-directory: shell/apps/desktop-windows
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          npm run build -- --config '{"version":"${{ needs.resolve.outputs.version }}"}'
      - name: Đóng gói tệp cài
        shell: pwsh
        run: |
          $version = "${{ needs.resolve.outputs.version }}"
          $setup = Get-ChildItem "shell\apps\desktop-windows\src-tauri\target\release\bundle\nsis" -Filter "*setup.exe" | Select-Object -First 1
          if (!$setup) { throw "setup.exe missing" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $setup.FullName "out\Galaxy-Blackhole-$version-Windows-x64-setup.exe" -Force
          Get-ChildItem out | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: out/*.exe
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux x64
    needs: resolve
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HARNESS_REPO }}
          ref: ${{ inputs.harness_ref || 'main' }}
          path: shell
      - name: Thư viện hệ thống cho Tauri (webkit2gtk 4.1)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libsoup-3.0-dev xz-utils rsync file
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shell/apps/desktop-windows/src-tauri
      - name: Đóng host harness từ npm
        run: |
          version="${{ needs.resolve.outputs.harness_version }}"
          tarball="${{ needs.resolve.outputs.tarball }}"
          echo "harness $version"
          npm install --prefix "$RUNNER_TEMP/stage" "$tarball" --omit=dev --no-audit --no-fund
          pkg="$RUNNER_TEMP/stage/node_modules/@galaxy-blackhole/blackhole-harness"
          test -f "$pkg/apps/cli/lib/main.js"
          res="$PWD/shell/apps/desktop-windows/src-tauri/resources"
          rm -rf "$res" && mkdir -p "$res/host" "$res/runtime"
          rsync -a "$pkg/" "$res/host/"
          rsync -a "$RUNNER_TEMP/stage/node_modules/" "$res/host/node_modules/"
          fe="$RUNNER_TEMP/stage/node_modules/@deepseek-ai/dsh-web-frontend"
          if [ -d "$fe" ]; then
            mkdir -p "$res/host/packages/host/web-app/node_modules/@deepseek-ai"
            rsync -a "$fe" "$res/host/packages/host/web-app/node_modules/@deepseek-ai/"
          fi
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - name: Tải runtime Node ${{ env.NODE_RUNTIME_VERSION }} linux-x64
        run: |
          url="https://nodejs.org/dist/v${{ env.NODE_RUNTIME_VERSION }}/node-v${{ env.NODE_RUNTIME_VERSION }}-linux-x64.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/node"
          tar -xJf "$RUNNER_TEMP/node.tar.xz" -C "$RUNNER_TEMP/node" --strip-components=1
          cp "$RUNNER_TEMP/node/bin/node" shell/apps/desktop-windows/src-tauri/resources/runtime/node
          chmod +x shell/apps/desktop-windows/src-tauri/resources/runtime/node
          "$RUNNER_TEMP/node/bin/node" --version
      # AppImage cần FUSE (linuxdeploy) hay hỏng trên runner; .deb cài được ngay trên Debian/Ubuntu.
      - name: Build vỏ Tauri Linux (.deb)
        working-directory: shell/apps/desktop-windows
        run: |
          npm install --no-audit --no-fund
          npm run build -- --bundles deb --config '{"productName":"Galaxy Blackhole","identifier":"com.galaxyblackhole.desktop.linux","version":"${{ needs.resolve.outputs.version }}","bundle":{"targets":["deb"],"icon":["icons/icon.png"]}}'
      - name: Gom tệp cài
        run: |
          version="${{ needs.resolve.outputs.version }}"
          mkdir -p out
          find shell/apps/desktop-windows/src-tauri/target/release/bundle -maxdepth 3 -type f | head -40
          deb=$(find shell/apps/desktop-windows/src-tauri/target/release/bundle -name "*.deb" | head -1)
          appimage=$(find shell/apps/desktop-windows/src-tauri/target/release/bundle -name "*.AppImage" | head -1)
          if [ -n "$deb" ]; then cp "$deb" "out/Galaxy-Blackhole-$version-Linux-x64.deb"; fi
          if [ -n "$appimage" ]; then cp "$appimage" "out/Galaxy-Blackhole-$version-Linux-x64.AppImage"; fi
          ls -lh out
          test -n "$deb" -o -n "$appimage"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: out/*
          if-no-files-found: warn
          compression-level: 0

  release:
    name: Đăng lên release desktop-v${{ needs.resolve.outputs.version }}
    needs: [resolve, windows, linux]
    if: ${{ always() && needs.resolve.outputs.publish == 'true' && (needs.windows.result == 'success' || needs.linux.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Liệt kê tệp sẽ đăng
        run: ls -lh dist
      - name: Tạo/cập nhật release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: desktop-v${{ needs.resolve.outputs.version }}
        run: |
          notes="App desktop Galaxy Blackhole (macOS arm64/x64, Windows x64, Linux x64) · host harness ${{ needs.resolve.outputs.harness_version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG đã có, cập nhật asset"
          else
            gh release create "$TAG" --title "Galaxy Blackhole Desktop ${{ needs.resolve.outputs.version }}" --notes "$notes"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'